[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshwatch"
version = "1.0.0"
description = "Detect SSH brute force, credential spraying and post-failure logins from auth logs. Zero dependencies, SARIF output, CI-gateable."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samarpan Aree" }]
keywords = [
    "security",
    "ssh",
    "brute-force",
    "auth-log",
    "devsecops",
    "log-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.scripts]
sshwatch = "sshwatch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sshwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
